file_info:
    - description: >
          Non-actionable historical context pulled out of code comments and
          docs, kept here instead of scattered across the codebase. Kept in
          its own file, separate from iacs_manifest/, so it isn't scanned in
          as part of assessing requirements (audit.traceability,
          audit.requirement_coverage) -- load iacs_manifest/ alone for that;
          load this file too only when the history itself is useful. Mirrors
          story-simulator's own docs/manifest/history.yaml convention.
    - file_info

project_history:
    data:
        - description: >
              Non-actionable historical record of how the project reached its
              current shape.
    validate_write_checks_ported_from_story_simulator:
        - description: >
              iacs.validate_write's two mechanical checks
              (find_component_named_as_nested_entity,
              find_unknown_component_types) were ported from
              story-simulator's own story_simulator/core.py, which found
              these are the exact failure modes a weak LLM actually hits
              composing entity-first YAML by hand -- see that repo's
              docs/manifest/history.yaml for the specific incidents each
              check targets (nested_component_name_collision_check_added,
              mechanical_component_type_validation_added). Generalized here
              since nothing about them is story-simulator-specific.
    view_entity_markdown_outline_favored_for_llm_parsing:
        - description: >
              Registry.view_entity's "markdown" format is a key: value
              outline, not a table -- published LLM-parsing-accuracy
              comparisons favor this over table/CSV formats, which is what
              actually reads this output, not another program. Ported from
              story-simulator's own hand-rolled version and generalized here
              so every caller benefits, not just story-simulator's own
              delegate.
    human_validated_tests_reused_emc2p_shared_framework:
        - description: >
              tests/test_human_validated.py's load-manifest / apply-
              transformation / compare-to-expected.py pattern predates the
              3-repo split -- emc2p's own emc2p.testing.expected_fixtures
              generalizes exactly this shape (example_dirs,
              load_expected_module, assert_subset/assert_not_subset,
              assert_registries_equal, ExpectedValueChecker). Rewritten to
              import from there instead of keeping its own copy; iacs still
              supplies its own examples/expected/ layout and
              DATAFLOW_MODULE_PREFIXES (iacs.dataflows./emc2p.dataflows.),
              nothing else.
    emc2p_submodule_dropped_for_pinned_git_dependency:
        - description: >
              emc2p was vendored as a git submodule at ./emc2p purely so a
              single-repo-attached Claude Code session could reach its
              source for editable local dev -- no longer needed once
              multiple repos could be attached to one session directly.
              Replaced with a plain pinned dependency in pyproject.toml's
              [tool.uv.sources] (commit SHA, not branch, bumped explicitly
              the same way the submodule pointer used to be). A gitignored,
              uncommitted uv.toml can still override it to a local editable
              path for fast co-development iteration.
    requirement_solution_consideration_moved_to_emc2p:
        - description: >
              requirement, solution, consideration, and
              consideration_rating moved from iacs/builtins/components.yaml
              to emc2p/builtins/auditing.yaml -- they're generic
              requirement/solution-scoring vocabulary, not
              infrastructure-as-code-specific, and a downstream project
              (story-simulator) was already using them without depending on
              iacs at all, relying on emc2p's schema-optional duck-typing
              instead of a real schema. See emc2p's own history.yaml for
              the corresponding entry (requirement's reshape into a
              directed_relation, requirement_priority, required_by,
              consideration_rating.value becoming nullable) -- this repo's
              side of the move was updating every reference: iacs/dataflows/
              derive/impact_cost.py, audit/traceability.py, audit/
              requirement_coverage.py, views/requirement_tree.py, the
              iacs_manifest/ files themselves, examples/, and their
              expected fixtures.

              iacs/mcp_server.py's build_format_description() read
              component specs only from iacs's own components.yaml, so it
              silently stopped documenting these four types the moment
              they moved -- caught by an existing test
              (test_component_specs_sourced_from_components_yaml).
              Fixed by also reading emc2p/builtins/auditing.yaml, with a
              second test confirming that path specifically.
    pure_connection_architecture_added_as_a_third_modeling_style:
        - description: >
              iacs_manifest/iacs.yaml uses one convention throughout: a
              requirement tree (iacs:) mirrored against a separate solution
              tree (iacs_solution:), connected by solution of: links across
              the two. A new subtree (iacs_meta_discussion.
              requirement_solution_modeling_discussion) tries two
              alternatives explicitly, to compare: an alternating-nested
              tree (requirement/solution entities nested directly inside
              each other instead of two mirrored trees -- see
              have_a_good_scoring_system), and a pure_connection_architecture
              with no `- requirement`/`- solution` tags at all, entities
              related purely through the solution/required_by relations
              (see emc2p's own history.yaml) -- an entity's role implied
              entirely by which relations point at it.

              Building the second one surfaced a real entity_ref
              resolution gap, pre-existing and not limited to the new
              content: Registry.get_entity_id resolves a bare name via
              exact hash, then exact alias (a two-segment "parent_key.
              entity_key" string, not the bare key alone unless the entity
              is top-level), then substring-match against every entity's
              full path. A non-top-level entity with any children is
              therefore ambiguous under its own bare name -- the entity's
              own path is a prefix of each child's path, so a substring
              search matches both. Confirmed this already silently broke
              every solution of: reference in the pre-existing
              iacs_solution: mirrored tree (their value_eid never
              resolves); fixed the new content's own references by using
              the full two-segment alias instead of the bare name. The
              pre-existing tree's own references are still unresolved --
              not fixed here, out of scope for this change.
    slow_pytest_marker_added_for_a_quick_check_command:
        - description: >
              No fast test subset existed. Profiled with --durations=30:
              no single dominant offender, but tests/test_mcp_server.py (76
              tests, each reloading a fresh Registrar), tests/
              test_human_validated.py (end-to-end example manifests),
              tests/test_startup_performance.py (subprocess-based import/
              install timing), and test_package.py's one submodule-import
              smoke test account for most of the full suite's wall time via
              sheer test volume, not any one slow operation. Marked `slow`;
              `uv run pytest -m "not slow"` cuts local wall time from ~285s
              to ~90s with the full suite still passing unchanged --
              documented in README.md, mirroring emc2p's own `live` marker
              convention.
    why_chain_poc_moved_from_emc2p:
        - description: >
              poc/why_chain/ (a "why chain" experiment -- entity-first
              manifests recording open-ended design rationale, converging
              on one shared goal rather than pairing requirements with
              solutions) started as a series of iterations directly in the
              emc2p repo. Moved here once it became clear the experiment
              itself is an iacs use case (documenting/designing something)
              rather than emc2p's own concern (the generic ECS engine);
              emc2p's own PR for it was closed unmerged. Brought its own
              vendored, frozen copy of mcp_client_session.py rather than
              depending on emc2p picking up the closed PR's changes --
              iacs's own emc2p pin predates the docstrings that experiment
              added to 11 of that file's 19 objects, without which those
              objects wouldn't be loadable entities at all. Also hit the
              same kind of entity_ref ambiguity noted in
              pure_connection_architecture_added_as_a_third_modeling_style
              above: one Python-object reference used a bare two-segment
              alias
              (module leaf name + parent directory name) that changed when
              the file moved directories; fixed by updating it to the new
              alias rather than by making the reference itself more
              precise, since a module-level entity's alias is inherently
              tied to its parent directory's name (unlike a
              class.method-shaped alias, which isn't).
    why_chain_poc_placed_outside_examples_dir:
        - description: >
              Landed first at examples/why_chain/, which broke CI:
              tests/test_human_validated.py::test_end_to_end parametrizes
              over every subdirectory of examples/ unconditionally (see
              example_dirs in emc2p.testing.expected_fixtures -- no opt-out
              mechanism) and asserts a full load/export/reload round trip
              produces identical components. mcp_client_session.py's
              load_python-derived `calls` components (call-graph metadata
              emc2p's load_python attaches to every function/method
              automatically) don't survive that round trip --
              export_manifest doesn't re-serialize them, so the reloaded
              registry has zero where the original had 80, and the
              comparison fails. Every prior examples/ entry is plain
              hand-authored YAML with no embedded Python source, so nothing
              had hit this before. Moved the whole thing to poc/why_chain/
              instead of trying to make it satisfy a round-trip contract
              it was never meant to: examples/ is for hand-authored
              fixtures this repo's own ETL pipeline is tested against, not
              a Python-source-linked demo of load_python. poc/ isn't swept
              by example_dirs(), so this needed no change to shared test
              code or to emc2p's own export/comparison logic (the real
              root cause -- component_type flagged skip_on_export isn't
              also excluded from assert_registries_equal's round-trip
              comparison -- is an emc2p-level gap, out of scope here).
    how_chain_poc_added_as_reverse_of_why_chain:
        - description: >
              poc/how_chain/ runs the same kind of experiment as
              poc/why_chain/ in the opposite direction: instead of starting
              at one piece of code and asking "why" until the chain reaches
              emc2p_mission, it starts at emc2p_mission and asks "how" until
              the chain reaches every one of the 34 .py files in emc2p's own
              package. Defined a new `how` component (value/question/note,
              parent: directed_relation) rather than reusing `why`, because
              the two read in opposite directions: a `why` link is owned by
              the more abstract entity but is conceptually "asked" by the
              more concrete one (why_chain's viewer has to reverse the
              arrow and swap which panel shows the Q&amp;A to display that
              correctly), while a `how` link is both owned by and
              conceptually asked by the more abstract entity -- so its
              viewer draws edges in the data's own source-to-target
              direction with no reversal or panel-swap needed. Vendored
              emc2p's whole package tree (not just one file) to keep every
              file's two-segment alias (parent directory + filename) stable
              regardless of where the copy sits, the same reasoning
              why_chain_poc_moved_from_emc2p above used for one file.
              Eleven of the 34 files had no module-level docstring in the
              real repo -- without one, load_python creates no entity for
              that module at all -- so this vendored copy adds a minimal
              one-line docstring to each of those eleven, purely so every
              file becomes a loadable, linkable node; nothing else about
              those files changed. Verified programmatically before writing
              any visualization: single root (emc2p_mission, 0 incoming
              edges), all 46 how.value references resolved, 34 distinct
              leaves with 0 outgoing edges matching the 34 vendored files
              1:1, and no cycles.
    how_chain_extended_to_classes_and_functions:
        - description: >
              Extended how_chain_poc_added_as_reverse_of_why_chain two more
              levels down: each of the 34 files now links, via its own
              `how`, to its own top-level classes and functions, and each
              class with methods links to those -- 357 nodes total (was 47),
              up to 5 hops deep. A Python-sourced entity can only receive
              extra components by editing the Python source itself (a
              docstring's numpy-style "Components" section, or an __iacs__
              dict -- a YAML file's own top-level keys live in a completely
              separate entity-path namespace and can't "reopen" an
              existing entity by name), so every file's and class's module
              /class docstring in the vendored emc2p/ copy gained a
              Components section with a `how` list pointing at its own
              children, rather than those links living in how.yaml itself.
              88 of the 310 new class/function/method targets had no
              docstring at all in the real repo and so needed one added
              first, same reasoning as the 11 files in the entry above.
              Hit one new bug along the way: the docstring-editing script
              spliced each new Components-section docstring in by replacing
              the exact (lineno, col_offset)-(end_lineno, end_col_offset)
              span of the old docstring's AST node with new text that
              *also* started with its own leading indent -- doubling the
              indent on the opening `"""` line specifically (continuation
              lines were fine, since those already carried the right indent
              embedded in the replacement text). A one-line docstring (AST
              start/end on the same line) made this obvious once isolated:
              the class's own first statement ended up indented 8 spaces
              instead of 4, which Python's tokenizer accepted as a new
              -but-unexpected indent level, then rejected the next, correctly
              -indented statement as "unindent does not match any outer
              indentation level". Fixed by dropping the redundant leading
              pad from the replacement text, since the original line's own
              prefix (preserved up to the span's start column) already
              supplies it. Verified programmatically before touching the
              visualization: all 356 how.value references resolved, single
              root, acyclic, 100% reachable from the mission.
    how_chain_viz_made_collapsible:
        - description: >
              357 nodes rendered all at once (the force-layout approach
              both viz's used up to this point) turned out to be
              unreadable once how_chain grew past the file level down to
              classes and functions. Rebuilt graph/index.html's rendering
              around d3.hierarchy/d3.tree instead of a force simulation --
              a natural fit since how.yaml's graph is a strict tree (node
              count is always exactly edge count + 1: every non-mission
              node has exactly one parent, unlike why_chain's graph, which
              deliberately reuses hub concepts as multiple nodes' answers).
              The viewer now starts with only the mission node shown and
              expands one level at a time on click, collapsing back on a
              second click; search and the panel's own links auto-expand
              whatever collapsed ancestors stand between the current view
              and their target. Two bugs surfaced while building this,
              both worth remembering:

              First, the initial "collapse everything" pass walked the
              hierarchy via `root.each()` and nulled each node's own
              `.children` from inside the visit callback -- but
              `d3.hierarchy`'s `.each()` reads a node's `.children` to find
              what to visit next only *after* calling the callback for
              that node, so nulling it there made traversal stop
              descending right there. The practical effect: only the
              mission's own direct children ever actually got collapsed;
              everything two or more levels down kept its original,
              never-touched `.children` array intact, so expanding the
              mission once immediately revealed the entire rest of the
              357-node tree instead of just one level. Fixed by capturing
              every node into a flat `Map` once, up front, before any
              collapsing happens, and having the "collapse everything"
              pass walk that static list instead of the live `.children`
              chain -- a plain array iteration has no such
              self-interference.

              Second, the node tooltip's hover/focus handlers were still
              passing the raw datum bound to each SVG element straight to
              `showTip()`, unchanged from the old force-layout version --
              but that datum is now a `d3.hierarchy` node (`{data: {id,
              children}, parent, depth, ...}`), not the flat, data.json
              -shaped node (`{id, description, kind}`) `showTip()` expects.
              Every hover threw "Cannot read properties of undefined
              (reading 'replace')" trying to clean a `description` field
              that was never there. Fixed by resolving `nodeById.get(d.data.id)`
              before calling `showTip()`, the same pattern every other
              panel/highlight function already used to bridge from a
              hierarchy node back to its real data.

              A third, smaller issue: the collapse/expand "+"/"−" glyph
              used a literal Unicode minus sign (U+2212) in a
              `.text()` call, which rendered as mojibake under this
              sandbox's local test server (no explicit charset meta, so
              the browser guessed wrong) -- unlike every other Unicode
              character already in the page, which only ever appears as
              an HTML entity (`&rarr;`, `&mdash;`, ...) inside
              `innerHTML`, immune to this since named entities decode
              correctly regardless of the page's assumed encoding. Fixed
              by writing `"−"`/`"…"` (a JS escape sequence,
              pure ASCII in the source) instead of the raw character, in
              both this new glyph and the pre-existing `shortLabel`
              ellipsis truncation that had the same latent exposure.
              Harmless inside the real Artifact viewer (its own publish
              skeleton always sets a charset), but worth fixing at the
              source rather than relying on that.
