file_info:
    - description: >
          This file contains the additional component types iacs defines on
          top of emc2p's generic ones, for architecting solutions:
          cost/impact scoring, tasks, audits, and code-architecture
          relations. ``requirement``, ``solution``, ``consideration``, and
          ``consideration_rating`` used to live here too, but are generic
          enough to be useful to any project doing requirement/solution
          architecture, not just iacs -- they now live in emc2p itself
          (``emc2p/builtins/iacs.yaml``) so a project depending only on
          emc2p (not iacs), e.g. story-simulator, can still get a real
          schema for them instead of relying on emc2p's schema-optional
          duck-typing. ``requirement``'s ``parent: impact`` still points
          here, so a project using ``requirement`` without also depending
          on iacs won't have that parent resolve.
    - file_info

iacs_component:
    data:
        - description: Additional useful components defined by iacs.
        - parent: value

    impact:
        data:
            - description: >
                  Quantifies the positive impact or benefit associated with an entity.
                  Serves as the common ancestor for impact-related scoring components,
                  suited for agile prioritization frameworks (e.g. RICE, ICE, WSJF).
                  The name "value" was considered for this role but avoided because
                  "value" has a specific existing meaning in emc2p as the single-field
                  base component type.
            - parent: value
            - field:
                  value:
                      description: >
                          Impact score, with higher values corresponding to greater impact.
                      type: rating
                      default: 0.5
                  type:
                      description: The type of impact.
                      type: str
                      default: impact
                  conversion:
                      description: Count of units of subtype impact per normalized impact.
                      type: float
                      default: 1

    mission:
        - description: >
              Marks an entity as a root of the project's official requirement
              tree. When any entity carries this tag, requirement-tree views
              (e.g. iacs.views.requirement_tree.build_requirement_forest)
              scope themselves to only that entity's (or entities')
              descendants, instead of auto-detecting every disconnected
              requirement subtree in the manifest.
        - parent: tag

    impact_budget:
        - description: >
              Quantifies the budget (allotment) and conversion rate for a specific type of
              impact.  When an impact_budget component is not defined for an impact type
              the conversion is 1 and the budget is null, aka unlimited.
        - field:
              value:
                  description: The impact type this budget is associated with.
                  type: str
                  nullable: false
              normalized_value_per_unit:
                  description: >
                    Normalized units of impact per one unit of this impact type.
                  type: float
                  default: 1
              budget:
                  description:
                      Units of impact type until significantly diminishing returns. Null
                      means no limit.
                  type: float
              description:
                  description:
                      Information about the impact type and the corresponding
                      budget.
                  type: str

    calls:
        - description: >
              A directed_relation indicating the source entity's code calls the
              target entity's code -- a function/method call resolved
              statically from the AST by
              ``emc2p.dataflows.etl.load_python``, not confirmed to execute at
              runtime. The target is a best-effort dotted name (e.g.
              ``module.func``, or a bare method name with any leading
              ``self``/``cls`` dropped); it only resolves to an entity_ref
              when exactly one loaded entity's key matches, same as any
              other entity_ref, so calls to undocumented functions or
              third-party/stdlib code simply stay unresolved.
        - parent: directed_relation
        - field:
              value:
                  description: The entity being called.
                  type: entity_ref
              seq:
                  description: >
                      0-indexed first-occurrence order among the source
                      entity's distinct call targets (e.g. the 2nd distinct
                      thing it calls gets seq=1), not a line number or a
                      count of every call including repeats. Lets a
                      consumer (e.g.
                      ``architecture_graph.build_call_reachability``'s
                      ``order_edges``) recover "this call happens before
                      that one" without re-parsing the source.
                  type: int

    imports:
        - description: >
              A directed_relation indicating the source module imports the
              target module (or a specific name from it), resolved
              statically from the AST by
              ``emc2p.dataflows.etl.load_python``. Same best-effort,
              may-stay-unresolved entity_ref resolution as ((calls)).
        - parent: directed_relation
        - field:
              value:
                  description: The module (or imported name) being imported.
                  type: entity_ref

    cost:
        data:
            - description: >
                  Quantifies the cost or resource expenditure associated with an entity.
                  Serves as the common ancestor for cost-related components, suited
                  for agile prioritization frameworks (e.g. RICE, WSJF). Paired with
                  ((impact)) to enable impact-effort analyses.
            - parent: value
            - field:
                  value:
                      description: Cost magnitude, with higher values corresponding to greater cost.
                      type: float
                  type:
                      description:
                          The type of cost. Examples include time effort, story
                          points, and US dollars.
                      type: str
                      default: cost
                  schedule:
                      description: >
                          How often the cost needs to be paid, i.e. the maintenance
                          cost. Null indicates a one-time effort.
                      type: timedelta
                      default: null
    cost_budget:
        - description: >
              Quantifies the budget and conversion rate for a specific type of cost.
              When a cost_budget component is not defined for a cost type the conversion
              is 1 and the budget is null, aka unlimited.
        - field:
              value:
                  description: The cost type this budget is associated with.
                  type: str
                  nullable: false
              normalized_value_per_unit:
                  description: >
                    Normalized units of cost per one unit of this cost type.
                  type: float
                  default: 1
              budget:
                  description: Units of cost type available to spend. Null means no limit.
                  type: float
              description:
                  description:
                      Information about the cost type and the corresponding
                      budget.
                  type: str

    task:
        - description: >
              Indicates that an entity represents a task that needs to be completed,
              either by a human or by automated infrastructure.
              To create a repeatable task to execute, create an entity that
              inherits from ((task)).
              To create an instance of a task, including start time, execution_state,
              etc., add a component instance of ((task)) to an entity.
        - parent: value
        - field:
              start:
                  description: Time the task was started at.
                  type: timestamp
              end:
                  description: Time the task ended.
                  type: timestamp
              execution_state:
                  description: State of the task in execution.
                  default: not started
                  type: str
                  range:
                      - not started
                      - planned
                      - in progress
                      - interrupted
                      - complete
              result_state:
                  description: Outcome state of the task.
                  type: str
                  range:
                      - success
                      - failure
                      - interrupted
              executor:
                  description: The entity responsible for executing the task.
                  type: entity_id

    work_state:
        - description: >
              The status of an entity, in terms of implementation.
        - parent: value
        - field:
              value:
                  description: A string indicating the status of the entity.
                  type: str
                  range:
                      - new
                      - in progress
                      - in review
                      - blocked
                      - done
                      - removed
                  nullable: false

    todo:
        - description: >
              Indicates something about the entity that needs to be addressed or completed.
              Used to track pending work items.
        - parent: value
        - field:
              value:
                  description: Description of what needs to be done.
                  type: str
              priority:
                  description: >
                      The priority, with higher values corresponding to higher priority.
                  type: float
                  default: 0.5
                  range: [0, 1]

    audit:
        data:
            - description: >
                  Component types produced by iacs audit dataflows. Each audit dataflow
                  stores its result as a component table in the registry. An empty result
                  table indicates the audit passed with no findings.
        requirement_coverage:
            - description: >
                  Output of the requirement coverage audit. One row per requirement entity,
                  showing which solution covers it and that solution's work state. A null
                  solution_eid indicates the requirement has no covering solution.
                  Generate with: run_dataflow('audit.requirement_coverage').
            - field:
                  solution_eid:
                      description: >
                          Entity ID of the solution that covers this requirement, if any.
                      type: entity_id
                      nullable: true
                  solution_status:
                      description: >
                          The work_state of the covering solution, or null if uncovered.
                      type: str
                      range:
                          - new
                          - in progress
                          - in review
                          - blocked
                          - done
                          - removed
                      nullable: true
        traceability:
            - description: >
                  Output of the traceability audit. One row per entity that does not trace
                  to any requirement. An empty table means all entities are fully traceable.
                  Generate with: run_dataflow('audit.traceability').
            - field:
                  message:
                      description: >
                          Diagnostic message indicating the entity does not trace to any requirement.
                      type: str
        todo:
            - description: >
                  Output of the todo audit. One row per entity with an outstanding todo item.
                  An empty table means no todos remain.
                  Generate with: run_dataflow('audit.todo').
            - field:
                  value:
                      description: Description of what needs to be done.
                      type: str
        invalid_field:
            - description: >
                  Records field constraint violations from schema validation.
                  Generated by the validation pipeline.
            - component_type:
                  skip_on_export: true

    entity_depth:
        - description: >
              Depth of an entity in the parent hierarchy. Derived from the parent
              component by iacs.dataflows.derive.impact_cost.
        - component_type:
              derived: true

    normalized_cost_total:
        - description: >
              Total normalized cost for an entity and all its descendants over a
              configured time period, weighted by the matching cost_budget
              normalized_value_per_unit. Derived from cost components by
              iacs.dataflows.derive.impact_cost.
        - component_type:
              derived: true

    priority_product:
        - description: >
              Product of requirement priorities for an entity and its requirement
              ancestors. Derived from requirement components by
              iacs.dataflows.derive.impact_cost.
        - component_type:
              derived: true

    resolved_impact_cost:
        - description: >
              Normalized impact and cost totals (plus their diff and ratio) for
              an entity, weighted by the matching impact_budget/cost_budget
              normalized_value_per_unit. Derived from impact and cost components
              by iacs.dataflows.derive.impact_cost.
        - component_type:
              derived: true
