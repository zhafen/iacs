iacs:
    be_a_powerful_tool_for_solutions_architecture:
        data:
            - description: >
                  iacs (short for Infrastructure-as-Code Sketch) is software designed to help
                  technical architects design arbitrary infrastructure in a code-first format
                  without worrying about the precise details of the implementation or the
                  system-specific syntax.
            - requirement_priority
            - mission
        provide_quality_end_to_end_documentation_of_infrastructure:
            data:
                - description: >
                      Provide a means to comprehensively and accurately document
                      infrastructure.
                - requirement_priority: 1.0
            provide_a_source_of_truth:
                data:
                    - requirement_priority
                minimize_duplication:
                    data:
                        - requirement_priority: {type: quality}
                    parse_infrastructure_in_a_wide_variety_of_formats:
                        data:
                            - description: >
                                  If infrastructure is defined elsewhere in an
                                  existing format, we don't want to duplicate it and
                                  therefore introduce a source of uncertainty.
                            - requirement_priority
                        parse_a_variety_of_IaC_formats:
                            - description: >
                                  We don't want to duplicate other IaC code if
                                  possible.
                            - requirement_priority
                            - cost:
                                value: 26
                                type: high_intensity_development_hours
                        parse_code_languages:
                            - description: >
                                  Code such as Python also provides clear definitions.
                            - requirement_priority
                            - cost:
                                value: 16
                                type: development_hours
                        parse_natural_language:
                            - id: parse_natural_language
                            - description: >
                                  Natural language is the most accessible way for users to
                                  describe infrastructure, removing the need to learn a
                                  specific syntax or format. Translating free-form text
                                  into ECS data requires resolving coreferences, extracting
                                  atomic facts, and mapping them to canonical entity and
                                  component representations.
                            - requirement_priority
                            - cost:
                                value: 42
                                type: high_intensity_development_hours
                compatible_with_version_control:
                    - description: >
                          Version control is essential for reliability.
                    - requirement_priority: {type: constraint}
                aggregate_all_definitions_in_one_location:
                    - description: >
                          A source of truth is not *a* source of truth if it is
                          distributed.
                    - requirement_priority
            comprehensively_document_infrastructure:
                data:
                    - description: >
                          This is one of the key features iacs provides that other
                          modeling tools do not--the ability to define and model
                          every type of infrastructure conceivable.
                    - requirement_priority: 1.0
                accept_user_defined_infrastructure:
                    data:
                        - description: >
                              Users need to be able to describe the infrastructure they
                              want to build.
                        - requirement_priority
                    describe_infrastructure_with_ecs_framework:
                        - id: ecs_framework_base_requirement
                        - description: >
                              One potential solution for allowing users to define
                              infrastructure is via an ECS framework.
                        - requirement_priority
                compatible_with_any_type_of_infrastructure:
                    data:
                        - requirement_priority: {type: constraint}
                    compatible_with_standard_components:
                        - description: >
                              We need to be able to define standard parts of solutions
                              architecture, e.g. users.
                        - requirement_priority: {type: constraint}
                    compatible_with_human_executed_infrastructure:
                        - description: >
                              Human-executed infrastructure is infrastructure that is
                              not yet (or cannot be) automated. Bureaucracies have a lot
                              of this.
                        - requirement_priority: {type: constraint}
                    compatible_with_abstract_components:
                        - description: >
                              Abstract components of infrastructure include
                              poorly-defined components and abstract concepts,
                              e.g. requirements.
                        - requirement_priority: {type: constraint}
                scales_well:
                    - description: >
                          We of course want the data format to be compatible with
                          expensive calculations, but this is definitely a lower
                          priority since we don't expect large volumes of data
                          in the course of planning.
                    - requirement_priority:
                          type: quality
                          value: 0.1
            provide_documentation_in_formats_meeting_all_common_needs:
                data:
                    - requirement_priority
                have_good_formats:
                    have_human_and_agent_friendly_input_format:
                        - description: In the ECS framework this is the entity-first format.
                        - requirement_priority: 0.9
                    have_analysis_friendly_ingested_format:
                        - description: >
                            In the ECS framework this is the component-first format.
                        - requirement_priority: 0.9
                    export_infrastructure_to_wiki:
                        - description: >
                            Wikis are a very common and readable way of documenting
                            knowledge. This would be a good and easy default.
                        - requirement_priority
                        - cost:
                            value: 10
                            type: low_intensity_development_hours
                transform_between_formats:
                    data:
                        - requirement_priority: 0.9
                    transform_between_entity_first_and_component_first:
                        - requirement_priority: 0.9
                        - cost:
                            value: 16
                            type: development_hours
            address_issues_with_multiple_possible_representations:
                data:
                    - requirement_priority: 0.7
                address_when_to_make_fields_a_particular_object_type_vs_a_base_type:
                    - requirement_priority: 0.7
                address_when_use_parents_vs_components:
                    - requirement_priority: 0.9
        improve_system_design_and_implementation:
            data:
                - requirement
            procedure_for_designing_and_implementing_systems:
                data:
                    - description: >
                          Coming up with a series of steps to design infrastructure
                          that one then follows with the help of the code (or even
                          has an agent perform end to end) could be powerful.

                          Our series of steps revolves around requirements and the
                          systems that solve them.
                    - solution
                    - pro: Can offload a lot of the hard decisions.
                    - con: Has to be designed.
                employs_model_for_solution_architecture:
                    data:
                        - description: We need a language for designing and implementing systems, which is what the model is.
                        - requirement
                    goal_oriented_requirement_engineering_model:
                        data:
                            - description: |
                                Goal-Oriented requirement engineering (GORE) is a common framework to accomplish objectives.
                            - solution
                        iacs_model:
                            data:
                                - description: Our homebrewed model.
                                - solution
                            has_defined_terms:
                                data:
                                    - requirement
                                requirement:
                                    - description: What we want to accomplish.
                                    - duplicate of: <<the requirement component that's part of the builtins>>
                                solution:
                                    - description: How we want to accomplish it.
                                    - duplicate of: <<the solutions component that's part of the builtins>>
                            has_organizational_structure:
                                data:
                                    - requirement
                                requirement_solution_tree:
                                    data:
                                        - description: A nested tree of both requirements and solutions.
                                        - solution
                                    concise_and_intuitive_syntax:
                                        data:
                                            - requirement of: requirement_solution_tree
                                        relationship_syntax_for_children:
                                            data:
                                                - requirement of: concise_and_intuitive_syntax
                                            use_relative_path_in_relation:
                                            implied_relationship:
                                                - description: Any parent-child relationship is
                                                    implicitly a requirement or solution relationship,
                                                    though which is not specified.
                                                - pro: What if we need to use the implied relationship for other things? In fact, we already do that for component inheritance.
                                            implied_relationship_with_comp:
                                                - description: If the entity owns a requirement or
                                                    solution with no target then it is the
                                                    requirement/solution to its parent.
                employs_a_plan:
                    data:
                        - description: Once we have a language, we need a process/algorithm/plan to accomplish our goals.
                        - requirement
                    accomplishes_gore_objectives:
                        data:
                            - requirement
                        can_elicit_and_refine_goals:
                            data:
                                - requirement
                            requirement_creation_and_population_process:
                                - description: |
                                    1. Select an entity alias. It should be short and meaningful.
                                    2. Add a description component with a value if not yet present.
                                    3. Add a bare requirement component if not yet present.
                                    4. Attempt to assemble a dictionary of solutions. Each key is the entity alias, and each value is a description.
                                    5. For each solution create a new child entity.
                                        a. Use the key as the alias.
                                        b. Use the value as the value for a description component.
                                        c. Add a bare solution component.
                                        d. For each solution, follow the solution_creation_and_population_process.
                                    6. If no solutions were identified, attempt to break the problem down into smaller pieces by creating a dictionary of sub-requirements. Each key is the entity alias, and each value is a description.
                                    7. For each requirement create a new child entity.
                                        a. Use the key as the alias.
                                        b. Use the value as the value for a description component.
                                        c. Add a bare requirement component.
                                        d. For each requirement, follow the requirement_creation_and_population_process.
                                - solution
                                - solution of: accomplishes_gore_objectives.identify_relationships
                                - pro: Straightforward.
                                - con: Goes deep quickly, which may put effort where it's not needed.
                            requirement_or_solution_creation_process:
                                - description: Condensation of the logic from [requirement_creation_and_population_process] and [solution_creation_and_population_process].
                                - solution
                                - solution of: can_elicit_and_refine_solutions.propose_solutions
                                - solution of: accomplishes_gore_objectives.identify_relationships
                                - pro: Reduced code duplication.
                                - con: The condensed logic obfuscates what's going on.
                                - con: Goes deep quickly, which may put effort where it's not needed.
                            shallow_requirement_or_solution_creation_process:
                                - description: Same as [requirement_or_solution_creation_process], but after the minimal child entities are created, go back up one level and proceed to the next minimal entity.
                                - solution:
                                    selected: True
                                - solution of:
                                    value: can_elicit_and_refine_solutions.propose_solutions
                                    selected: True
                                - solution of:
                                    value: accomplishes_gore_objectives.identify_relationships
                                    selected: True
                                - pro: Reduced code duplication.
                                - pro: Bounces back up to top level to refocus on the big picture.
                                - con: If the process isn't interrupted this isn't any better than [requirement_or_solution_creation_process].
                        can_elicit_and_refine_solutions:
                            data:
                                - requirement
                            propose_solutions:
                                data:
                                    - requirement
                                solution_creation_and_population_process:
                                    - description: |
                                        1. Select an entity alias. It should be short and meaningful.
                                        2. Add a description component with a value if not yet present.
                                        3. Add a bare solution component if not yet present.
                                        4. Is how to implement the solution self-evident? If so, return.
                                        5. Attempt to assemble a dictionary of requirements for the solution to function. Each key is the entity alias, and each value is a description.
                                        6. For each requirement create a new child entity.
                                            a. Use the key as the alias.
                                            b. Use the value as the value for a description component.
                                            c. Add a bare requirement component.
                                            d. For each requirement, follow the requirement_creation_and_population_process.
                                    - solution
                                    - solution of: accomplishes_gore_objectives.identify_relationships
                                    - pro: Straightforward.
                                    - con: Goes deep quickly, which may put effort where it's not needed.
                        can_operationalize_goals_and_solutions:
                            data:
                                - requirement
                            select_solutions:
                                data:
                                    - description:
                                        Once multiple candidate solutions exist for a
                                        requirement, we need a way to choose among them --
                                        for example, a good scoring system.
                                    - requirement
                                identify_valid_solutions:
                                    data:
                                        - requirement
                                    brute_force_combinations_evaluation:
                                        - description: Each solution is for one or more requirements. Try all combinations of solutions and include only those where all requirements are satisfied.
                                        - solution
                                select_among_valid_solutions:
                                    data:
                                        - requirement
                                    choose_highest_impact_cost_ratio:
                                        data:
                                            - solution
                                        evaluate_impact:
                                            data:
                                                - requirement
                                            have_a_good_flow_for_choosing_categories:
                                                data:
                                                    - requirement
                                                no_categories:
                                                    - solution
                                                simple_categories:
                                                    - solution
                                        evaluate_cost:
                                            - requirement
                                    select_ideal_solution_for_each_requirement:
                                        data:
                                            - solution
                                            - con: How do we handle when the combination of ideal individual solutions isn't an overall solution?
                                        have_approach_for_evaluating_solutions_for_a_single_requirement:
                                            data:
                                                - requirement
                                            qualitative_evaluation:
                                                - description: Read the possible options and then make a choice.
                                                - solution
                                    consideration_scoring_process:
                                        data:
                                            - solution
                                            - description: >
                                                Score each candidate solution's pros and cons
                                                using iacs's own consideration/
                                                consideration_rating types: a named axis
                                                (consideration) with a weight, and each
                                                solution's rating against that axis.
                                            - work_state: in progress
                                        capture_pros_and_cons:
                                            data:
                                                - requirement
                                                - requirement_priority
                                                - description: >
                                                    The scoring system must capture both pros
                                                    and cons. Already met directly by
                                                    consideration_rating's own note + signed
                                                    rating fields, so no separate nested
                                                    solution is needed here.
                                            consideration_and_consideration_rating_components:
                                                - solution
                                                - pro: Precise.
                                            pro_con_components:
                                                data:
                                                    - solution
                                                    - pro: Very intuitive, very quick to write. Can come back and refine later.
                                                    - con: Multiple component types for one table.
                                                handle_multiple_component_types_in_one_table:
                                                    - requirement
                                        intuitive_weight_scale:
                                            data:
                                                - requirement_priority
                                                - description: >
                                                    An axis's importance (weight) must
                                                    reflect human judgment intuitively.
                                            log_scale_weights:
                                                - solution of: consideration_scoring_process.intuitive_weight_scale
                                                - description: >
                                                    Discrete multiplicative grades --
                                                    baseline 8, 1 = low importance,
                                                    64 = high importance.
                                                - todo: >
                                                    Fill in consideration_rating pros/cons
                                                    once the axes for evaluating scale
                                                    formats themselves are decided.
                                            integer_scale_weights:
                                                - solution of: consideration_scoring_process.intuitive_weight_scale
                                                - description: Small signed integers.
                                                - todo: >
                                                    Fill in consideration_rating pros/cons
                                                    once the axes for evaluating scale
                                                    formats themselves are decided.
                                            float_unbounded_weights:
                                                - solution of: consideration_scoring_process.intuitive_weight_scale
                                                - description: >
                                                    Continuous float, -inf to inf (the
                                                    current approach).
                                                - todo: >
                                                    Fill in consideration_rating pros/cons
                                                    once the axes for evaluating scale
                                                    formats themselves are decided.
                                        intuitive_rating_scale:
                                            data:
                                                - requirement_priority
                                                - description: >
                                                    Each solution's per-axis rating must
                                                    reflect human judgment intuitively.
                                            log_scale_ratings:
                                                - solution of: consideration_scoring_process.intuitive_rating_scale
                                                - description: Discrete multiplicative grades.
                                                - todo: >
                                                    Fill in consideration_rating pros/cons
                                                    once the axes for evaluating scale
                                                    formats themselves are decided.
                                            integer_scale_ratings:
                                                - solution of: consideration_scoring_process.intuitive_rating_scale
                                                - description: Small signed integers.
                                                - todo: >
                                                    Fill in consideration_rating pros/cons
                                                    once the axes for evaluating scale
                                                    formats themselves are decided.
                                            float_unbounded_ratings:
                                                - solution of: consideration_scoring_process.intuitive_rating_scale
                                                - description: >
                                                    Continuous float, -1 to 1 (the current
                                                    approach).
                                                - todo: >
                                                    Fill in consideration_rating pros/cons
                                                    once the axes for evaluating scale
                                                    formats themselves are decided.
                                        handle_all_sign_combinations:
                                            data:
                                                - requirement_priority
                                                - description: >
                                                    good axis + good rating = pro, good axis
                                                    + bad rating = con, bad axis + good
                                                    rating = pro (two negatives), bad axis +
                                                    bad rating = con -- all four must come
                                                    out intuitively.
                                            signed_weight_times_signed_rating:
                                                - solution of: consideration_scoring_process.handle_all_sign_combinations
                                                - description: >
                                                    contribution = weight * rating; the
                                                    product's sign determines pro/con.
                                                    Already implemented (see story-
                                                    simulator's live_testing_framework and
                                                    its generate_live_testing_report.py).
                                                - work_state: in progress
                            implement_solutions:
                                data:
                                    - requirement
                                design_architecture:
                                    data:
                                        - requirement
                                    derive_architecture_from_requirement_tree:
                                        - solution
                                        - pro: If this works, it would reduce effort required.
                                        - con: If this doesn't work, a lot of time might be required to fix it.
                                    lay_out_solutions_and_organize:
                                        - solution
                                        - pro: Failsafe. Likely to create sound infrastructure.
                                        - con: Time intensive.
                                    lay_out_solution_and_have_agent_organize:
                                        - solution
                                        - pro: Saves time.
                                        - con: Architecture has to be evaluated.
                                code_up_solutions:
                                    data:
                                        - requirement
                                    agent_assisted_coding:
                                        data:
                                            - description: |
                                                Use one or more agents to code.

                                                Avoiding the term "vibe coding" because that doesn't
                                                imply validation.
                                            - solution
                                        test_driven_development:
                                            data:
                                                - description: Start with a test, ask the agent to pass it.
                                                - solution
                                            natural_language_driven_tdd:
                                                - description: Describe the conditions for passing, but the agent still creates the test.
                                                - solution
                                            human_validated_tdd:
                                                - description: Create a suite of well-understood gold standard tests the code must pass.
                                                - solution
                                        batches_of_tasks:
                                            data:
                                                - description: After an agent has implemented something record feedback and have the agent address as a batch.
                                                - solution
                                            github_review_task_batches:
                                                - description: Add comments as a review on github, then ask agent to address.
                                                - solution
                                            narrated_task_batches:
                                                - description: Review implementation and narrate thoughts as doing so. Then organize into tasks, and have the agent work on the tasks.
                                                - solution
                            prioritize_solutions:
                                data:
                                    - requirement
                                impact_cost_weighted_features:
                                    - description: >
                                        Among the overall requirement-solution tree identify
                                        individual features that stand alone, then implement them.
                                    - solution
                        can_include_new_information:
                            data:
                                - requirement
                        can_determine_what_to_work_on_at_a_given_time:
                            data:
                                - requirement
                            design_prioritize_implement_link_workflow:
                                data:
                                    - description: We have a process for each individually, but we also need a workflow to connect them.
                                    - solution
                                has_order_between_stages:
                                    data:
                                        - requirement
                                    main_loop:
                                        data:
                                            - description: Design -> prioritize -> implement -> link, repeat.
                                            - solution
                                has_stop_conditions_for_each_stage:
                                    condition_for_ending_design_phase:
                                        data:
                                            - requirement
                                        allow_each_design_to_complete_fully:
                                            - solution
                                            - pro: Straightforward.
                                            - con: Not clear how long this will take.
                                            - con: Likely to learn things during implementation that change the approach.
                                        start_implementation_immediately_on_reaching_max_depth:
                                            - solution
                                            - pro: Start work getting done.
                                            - con: May not have sufficient context to implement.
                                            - con: Prioritization is auto-done to just be what you reach first.
                                        minimum_feature_count:
                                            data:
                                                - description: >
                                                    Identify features, stand-alone parts of the
                                                    solution, and when N features are defined move on to
                                                    the next stage.
                                                - solution
                                                - pro: Balance between getting everything done and jumping in blindly.
                                            identify_features:
                                                data:
                                                    - requirement
                                                top_down:
                                                    - description: >
                                                        Start at the top and for each child evaluate if it's a feature, aka standalone.
                                            determine_what_n_is:
                                                data:
                                                    - requirement
                                                arbitrary_choice_of_three:
                                                    - solution
                                            ensure_features_are_ready_for_implementation:
                                                - requirement
                                    condition_for_ending_prioritize_phase:
                                        data:
                                            - requirement
                                        all_features_are_prioritized:
                                            - solution
                                    condition_for_ending_implement_phase:
                                        data:
                                            - requirement
                                        one_feature_complete:
                                            - description: As soon as a feature is complete, return to the design phase.
                                            - solution
                                            - con: Too much time in design phase?
                                        two_features_complete:
                                            - description: As soon as two features are complete, return to the design phase.
                                            - solution
                                        all_features_complete:
                                            - solution
                                            - con: Not enough anchored to design?
                        identify_relationships:
                            - description: We need to understand how requirements and solutions relate to each other.
                            - requirement
                    plan_quality_is_high:
                        plan_has_performance_metrics:
                            - description: >
                                  The plan should surface measurable performance
                                  metrics, not just completion state, so progress
                                  and quality can both be tracked.
                            - requirement
            launching_pad_for_implementation:
                data:
                    - description: Allow the IaC created via iacs to be converted into deployments.
                    - solution
                deploy_terraform_from_ec_files:
                    - requirement_priority: {type: constraint}
                    - cost:
                        value: 26
                        type: high_intensity_development_hours
                deploy_relational_databases_from_ec_files:
                    - requirement_priority: {type: constraint}
                    - work_state: done
            various_minor_features:
                data:
                    - description: >
                          Many solutions are too complex for a simple view, but they still
                          need to be assessed for completeness, accuracy, documentation, etc.
                    - solution
                provide_an_interface_for_interactive_development:
                    - requirement
                    - description: >
                        The start of this may be the d3js tree viewer we created.
                        But that feels like it's potentially starting from scratch.
                        We need to be careful.
                        If our focus is code
                allow_solution_designs_to_be_tested:
                    data:
                        - description: >
                              Requiring solutions to pass well-defined tests sets a
                              baseline minimum quality.
                        - requirement_priority
                    provide_tools_to_build_tests_for_system_designs:
                        - requirement_priority
                    provide_default_tests_for_systems:
                        data:
                            - requirement_priority
                        test_for_identifying_requirements_missing_solutions:
                            - description: >
                                  Tests for both requirements without solutions and
                                  requirements without adequate/implemented solutions.
                            - requirement_priority
                        trace_every_component_to_a_requirement:
                            - description: >
                                  There should be a motivation for every piece of
                                  infrastructure.
                            - requirement_priority
                        test_for_invalid_definitions:
                            - requirement_priority
                        test_for_siloed_infrastructure:
                            - description: >
                                  Everything should be part of one big solution.
                            - requirement_priority
                        test_for_completed_todos:
                            - requirement_priority
                convey_complex_architectures:
                    - description: >
                          Part of validation is also understanding how an architecture
                          works, for which we need views into the architecture.
                    - requirement_priority
                compatible_with_jotting_down_ideas:
                    data:
                        - requirement
                        - description: Each idea is a piece of a puzzle, which we need to then connect. So we need to capture the pieces when they show up.
                    easily_navigate_the_written_format:
                        data:
                            - solution:
                                selected: true
                            - pro: Already nice to have this.
                            - con: Non-negligible time to do this.
                        fast_keybindings:
                            - requirement
                    drop_ideas_in_and_connect_later:
                        - solution:
                            selected: true
                        - pro: Less interruption of flow.
                        - con: The implementation is more complicated.
iacs_solution:
    data:
        - description: >
                The iacs solution as a whole: a tool for solutions architecture that
                documents infrastructure, improves design quality, and launches
                implementations.
        - solution of: be_a_powerful_tool_for_solutions_architecture
    documentation_system:
        data:
            - description: >
                    Provides quality end-to-end documentation of infrastructure.
            - solution of: provide_quality_end_to_end_documentation_of_infrastructure
        source_of_truth_system:
            data:
                - description: >
                        Provides a single source of truth for infrastructure definitions.
                - solution of: provide_a_source_of_truth
            deduplication_system:
                data:
                    - description: >
                            Minimizes duplication across infrastructure definitions.
                    - solution of: minimize_duplication
                parser_system:
                    data:
                        - description: >
                                Parses infrastructure defined in a wide variety of formats.
                        - solution of: parse_infrastructure_in_a_wide_variety_of_formats
                    iac_format_parser:
                        data:
                            - description: Parses a variety of IaC formats.
                            - solution of: parse_a_variety_of_IaC_formats
                    code_language_parser:
                        data:
                            - description: Parses code languages such as Python.
                            - solution of: parse_code_languages
                    natural_language_parser:
                        data:
                            - description: >
                                    Parses natural language descriptions of infrastructure.
                            - solution of: parse_natural_language
            version_control_integration:
                data:
                    - description: >
                            Ensures infrastructure definitions are compatible with
                            version control systems.
                    - solution of: compatible_with_version_control
            manifest_aggregator:
                data:
                    - description: >
                            Aggregates all infrastructure definitions in one location.
                    - solution of: aggregate_all_definitions_in_one_location
        comprehensive_documentation:
            data:
                - description: >
                        Comprehensively documents all types of infrastructure.
                - solution of: comprehensively_document_infrastructure
            entity_definition_system:
                data:
                    - description: Accepts user-defined infrastructure descriptions.
                    - solution of: accept_user_defined_infrastructure
                ecs_framework:
                    data:
                        - description: >
                                Describes infrastructure using an ECS framework.
                        - solution of: describe_infrastructure_with_ecs_framework
            infrastructure_compatibility_system:
                data:
                    - description: >
                            Ensures compatibility with any type of infrastructure.
