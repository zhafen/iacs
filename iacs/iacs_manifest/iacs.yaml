                - description: If we stop, we need to be able to pick a part and move forward.
                - requirement
            pre_stop_cleanup_hook:
                - solution
                - pro: Can help ensure there are discrete units.
                - con: Still takes time.
            well_defined_branches_can_be_worked_on_independently:
                data:
                    - solution
            must_handle_broken_links:
                - requirement
            must_be_able_to_list_units_of_work:
                data:
                    - requirement
                must_include_high_priority_branches_that_are_not_quite_right:
                    - description: If there's an important branch we don't want it to be ignored because
                    - requirement
                walk_top_to_bottom:
                    - description: Start from the top then successively navigate branches.
                    - solution
                    - pro: Refocuses on goals.
                    - con: Might be hard to design.
                    - con: How do we handle incomplete branches?
                    - con: This seems like it will take a while.
                    - con: How do we handle branches not connected?
                walk_from_most_to_least_complete:
                    - solution
                    - pro: Focuses on well defined work.
                    - con: Not related to project goals.
                walk_impact_cost_graph:
                    - solution
                    - pro: Good return on investment.
                    - con: Requires impact and cost to be defined, and it might be too early for that.

visualization_of_requirement_solution_graph:
    - description: What does this look like?
    - solution
    - pro: Satisfies my curiousity.

handle_benefits_for_solution:
    - description: >
          Consider app A. It was created to help improve people's lives by
          providing a compass to nearby cats, redirecting when
          doomscrolling is detected, and planning meals. Each of those are
          clearly features. Are they also requirements or also solutions
          or neither? Why does it matter?

          It matters: requirements are concepts, solutions are concrete
          objects (same distinction as handle_when_to_use_solutions_vs_
          requirements.objective_vs_object), and that distinction matters
          for implementation. So a feature is a solution, not a
          requirement. A solution can solve one or more requirements, and
          once it exists it stands somewhat independently of whatever
          requirement motivated it -- fine, since tracing back to the
          requirement is still useful later, just not load-bearing moment
          to moment.

          Practically: a solution (like app A) can bundle a whole set of
          features. What matters is that each feature addresses one or
          more requirements serving the overall objective, not that the
          solution maps 1:1 to a requirement. Workflow for building that:
          build solutions per requirement, connect/organize at the end.
          Each solution, standing on its own, is a feature -- so the
          overall tree still needs to be organized by requirements the
          way it already is. Underneath that, while heads-down on one
          requirement, don't over-think the organization -- just build a
          solution that satisfies it and nest it underneath. (Easier said
          than done.)

          Harder question from there, applying this same requirement/
          solution lens to the design/implement workflow itself
          (design_implement_cycle_workflow): switching between a design
          phase and an implement phase is itself a solution -- to what
          requirement? Design is a solution to identifying what to
          accomplish and how; implement is a solution to actually making
          it real. But the requirement behind *switching* between them
          (design_phase_must_have_stopping_points) -- rather than, say,
          finishing all design before any implementation -- is to make
          sure there's always something to implement, and that design
          doesn't run forever. Stated more generally: this alternation
          exists so we don't address one requirement to the detriment of
          another -- it keeps different requirements playing nicely
          together. Open question: is there already a name for that?

prior_art_for_alternating_requirement_solution_trees:
    - description: >
          Not the first to land on an alternating requirement/solution
          tree (design_implement_cycle_workflow, pure_connection_
          architecture, handle_benefits_for_solution): engineering
          design theory already has this under the name Function-Means
          trees (Hubka & Andreasen) -- alternating Function (requirement)
          and Means (solution) levels, each function attached to one or
          more means, each means decomposable into its own sub-functions.
          https://en.wikipedia.org/wiki/Function%E2%80%93means_tree

          Also worth noting: Keeney's Value-Focused Thinking goes the
          other way on purpose -- it keeps a pure Fundamental Objectives
          Hierarchy (requirements only) and a separate Means-Objectives
          Network (how candidate solutions affect those objectives) as
          two distinct structures, rather than merging them into one
          tree -- closer to this file's own mirrored iacs:/iacs_solution:
          convention than to the alternating-tree experiments above.

          Goal-Oriented Requirements Engineering (GORE -- KAOS, i*,
          Tropos) is a third: goals refined via AND/OR decomposition into
          sub-goals, eventually reaching tasks/operationalizations
          (solutions) via means-ends and task-decomposition links. Same
          shape as this file's own requirement/solution tree, "goal"/
          "task" instead of "requirement"/"solution." Foundational paper:
          van Lamsweerde, "Goal-Oriented Requirements Engineering: A
          Guided Tour," Proceedings RE'01, 2001, pp. 249-263 --
          https://webperso.info.ucl.ac.be/~avl/files/RE01.pdf (author's
          own hosted copy). Overview a few years on: Lapouchnian,
          "Goal-Oriented Requirements Engineering: An Overview of the
          Current Research," 2005 --
          https://www.cs.utoronto.ca/~alexei/pub/Lapouchnian-Depth.pdf.
          More recent still: Horkoff et al., "Goal-oriented requirements
          engineering: an extended systematic mapping study,"
          Requirements Engineering 24, 133-160 (2019), a systematic
          mapping study of 246 top-cited GORE papers --
          https://link.springer.com/article/10.1007/s00766-017-0280-z.

          The procedure actually in use here is still a homegrown one, a
          homebrewed model built up requirement by requirement rather
          than adopted wholesale from any of the three above -- these are
          recorded as potential future alternatives (or sources to borrow
          specific mechanisms from) if the homegrown approach runs into
          a wall it doesn't have a good answer for, not as a decision to
          switch to one of them now.