requirement_and_solution_constraints:
    data:
        - description: By placing constraints on the requirement-solution graph we may be able to improve system design.
        - solution: <<improve system design>>
        - pro: Depending on the exact solution, may be useful.
        - con: What is this actually capturing, other than ensuring things look pretty?
    requirements_and_solutions_must_alternate:
        - description: In a tree we enforce requirements and solutions to alternate.
        - solution:
            selected: False
        - pro: Helps validate tree structure.
        - pro: May provide some base structure.
        - con: Requires more thought when writing.
        - con: Doesn't really reflect how things are. For example, must_have_stopping_points has sub requirements that elaborate on the main requirement.
    no_solutions_of_solutions:
        - solution
        - pro: Meaning of solution of a solution is unintuitive.
        - con: If a requirement of a requirement is just an elaboration and/or subentity, we can do the same thing for solutions.
    no_mixing_requirements_and_solutions_at_same_depth:
        - solution
        - pro: Seems like it could increase messiness drastically.
        - con: Currently just a bad feeling, mostly.

handle_when_to_use_solutions_vs_requirements:
    data:
        - description: When the user creates a new requirement or solution, what do they write?
        - requirement
    no_distinction:
        - solution
        - pro: simplest on its face
        - con: what do we even call it? A dependency?
        - con: Are we going to get broken structures this way?
    objective_vs_object:
        - description: Requirements are goals. Solutions are concrete objects that contribute to fulfilling objectives.
        - pro: Matches intuition.
        - con: definition is maybe still a little vague.

design_implement_cycle_workflow:
    design_phase_must_have_stopping_points:
        data:
            - description: It's not clear how long the process of laying out requirements and solutions could take. Maybe an arbitrarily long time. If we never move on from this stage to the implementation stage we will never get anything done.
            - requirement
        intermediate_results_dont_corrupt_data:
            - requirement
        must_be_compatible_with_determining_what_to_work_on_next:
        must_have_units_of_work:
