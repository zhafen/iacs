    address_duplicates:
        - description: We'll inevitably have duplicated work.
        - requirement
    validate_linking_process:
        data:
            - requirement
        scrambled_tree_test:
            - description: Start with a tree, then remove all linkings and test re-assembly.
            - solution
            - pro: Easy to create.
