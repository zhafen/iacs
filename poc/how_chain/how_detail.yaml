file_info:
- description: 'The 310 how-chain edges one and two levels below the file level: file -> its
    own classes/functions, and class -> its own methods. Moved here from being embedded in
    the vendored emc2p/ tree''s own docstrings, once it became clear that data belongs in
    the manifest as real YAML, not hidden in source code where it doesn''t show up as part
    of the project the way how.yaml''s own 46 top-level edges do. See how_link''s own description
    for why a new component type was needed rather than reusing ((how)).'
- file_info
how_link:
- description: 'A how-chain edge declared on its own, naming both ends explicitly (`source`
    and `value`), rather than living on either one as an owned component. ((how)) can''t be
    used for a link between two real Python objects -- a file and one of its own classes or
    functions, or a class and one of its own methods -- because *both* ends are already-existing
    code entities, and a YAML file can only add a new component to an entity it declares itself,
    never to one sourced from a .py file (see docs/manifest/history.yaml: how_chain_detail_moved_to_yaml).
    `how` still works fine for how.yaml''s own hand-written entities, where the asking side
    is always a YAML concept that can safely own the link.'
- parent: directed_relation
- field:
    source:
      description: The entity that asks how it is achieved.
      type: entity_ref
    value:
      description: The entity that is how the source gets achieved.
      type: entity_ref
    question:
      description: The exact "how" question this link is answering, from the source entity's
        point of view.
      type: str
    note:
      description: An optional side note about this link.
      type: str
      nullable: true
how_chain_detail:
- description: 'Every how_link edge between two real Python objects: a file and its own top-level
    classes/functions, or a class and its own methods -- the two levels below each file in
    how.yaml''s tree. Declared as one flat list on this single entity, since neither endpoint
    of any of these edges can own a new component itself (see how_link''s own description).
    Regenerate this file from a fresh load of the vendored emc2p/ tree if that tree''s structure
    changes; it''s generated, not hand-written.'
