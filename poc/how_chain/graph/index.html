<title>How Chain Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #f8f4ec;
    --bg-wash: #f1ecdf;
    --surface: #fffdf9;
    --surface-2: #eee7d7;
    --ink: #241f14;
    --ink-2: #5b5344;
    --ink-3: #8a8172;
    --border: rgba(36,31,20,0.13);
    --border-strong: rgba(36,31,20,0.24);
    --mission: #a3701e;
    --mission-glow: rgba(163,112,30,0.35);
    --concept: #4a3fa3;
    --code: #0f8a5f;
    --member: #0e7a90;
    --edge: #cdc3ae;
    --edge-dim: #e3ddcc;
    --focus: #a3701e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0b0d11;
      --bg-wash: #0e1015;
      --surface: #14171d;
      --surface-2: #1b1f27;
      --ink: #f2eee3;
      --ink-2: #b7b2a4;
      --ink-3: #7c7869;
      --border: rgba(255,255,255,0.10);
      --border-strong: rgba(255,255,255,0.18);
      --mission: #d99a35;
      --mission-glow: rgba(217,154,53,0.35);
      --concept: #7f74d9;
      --code: #22ad82;
      --member: #3fc3de;
      --edge: #313640;
      --edge-dim: #22262e;
      --focus: #d99a35;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0b0d11;
    --bg-wash: #0e1015;
    --surface: #14171d;
    --surface-2: #1b1f27;
    --ink: #f2eee3;
    --ink-2: #b7b2a4;
    --ink-3: #7c7869;
    --border: rgba(255,255,255,0.10);
    --border-strong: rgba(255,255,255,0.18);
    --mission: #d99a35;
    --mission-glow: rgba(217,154,53,0.35);
    --concept: #7f74d9;
    --code: #22ad82;
    --member: #3fc3de;
    --edge: #313640;
    --edge-dim: #22262e;
    --focus: #d99a35;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    overflow: hidden;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  /* ---------- top bar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 14px 20px;
    padding-inline: max(20px, env(safe-area-inset-left)) max(20px, env(safe-area-inset-right));
    border-bottom: 1px solid var(--border);
    background: var(--bg-wash);
    flex-wrap: wrap;
    flex-shrink: 0;
  }
  .brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .brand h1 {
    font-family: "Fraunces", serif;
    font-weight: 600;
    font-size: 21px;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    white-space: nowrap;
  }
  .brand p {
    margin: 0;
    font-size: 12.5px;
    color: var(--ink-2);
    white-space: nowrap;
  }
  .stats {
    display: flex;
    gap: 14px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    color: var(--ink-3);
    white-space: nowrap;
  }
  .stats b { color: var(--ink-2); font-weight: 500; }

  .search-wrap {
    position: relative;
    margin-left: auto;
    flex: 0 1 240px;
    min-width: 140px;
  }
  #search {
    width: 100%;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12.5px;
    padding: 7px 10px 7px 30px;
    border-radius: 7px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--ink);
    outline: none;
  }
  #search:focus { border-color: var(--focus); box-shadow: 0 0 0 3px var(--mission-glow); }
  .search-wrap svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); pointer-events: none; opacity: .5; }

  .legend {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 11.5px;
    color: var(--ink-2);
    flex-wrap: wrap;
  }
  .legend .item { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

  button.reset {
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-2);
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 7px;
    padding: 7px 11px;
    cursor: pointer;
    white-space: nowrap;
  }
  button.reset:hover { color: var(--ink); border-color: var(--ink-3); }
  button.reset:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* ---------- main area ---------- */
  .main {
    position: relative;
    flex: 1;
    display: flex;
    min-height: 0;
  }
  .stage {
    flex: 1;
    position: relative;
    min-width: 0;
    background:
      radial-gradient(ellipse 900px 500px at 50% 8%, var(--mission-glow), transparent 60%),
      var(--bg);
  }
  svg#graph { width: 100%; height: 100%; display: block; cursor: grab; }
  svg#graph.grabbing { cursor: grabbing; }

  .hint {
    position: absolute;
    left: 20px;
    bottom: 16px;
    font-size: 11.5px;
    color: var(--ink-3);
    max-width: 320px;
    line-height: 1.5;
    pointer-events: none;
  }

  /* node/edge svg styling */
  .edge { fill: none; stroke: var(--edge); stroke-width: 1.1; transition: stroke .25s, opacity .25s; }
  .edge.dim { opacity: .12; }
  .edge.lit { stroke: var(--focus); stroke-width: 1.6; opacity: .95; }
  .edge.child-lit { stroke: var(--code); stroke-width: 1.6; opacity: .95; }
  .node circle { stroke: var(--bg); stroke-width: 1.5; transition: opacity .25s, stroke-width .15s, r .32s; cursor: pointer; }
  .node.dim circle { opacity: .18; }
  .node.dim text { opacity: .12; }
  .node text {
    pointer-events: none;
    transition: opacity .25s, fill .2s;
  }
  .node text.label {
    font-family: "IBM Plex Mono", monospace;
    font-size: 9.5px;
    fill: var(--ink-2);
  }
  .node text.toggle {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    font-weight: 700;
    fill: var(--bg);
    text-anchor: middle;
  }
  .node.selected circle { stroke: var(--focus); stroke-width: 3px; }
  .node.selected text.label { fill: var(--ink); font-weight: 500; }
  .node.ancestor circle { stroke: var(--focus); stroke-width: 2px; }
  .node.child circle { stroke: var(--code); stroke-width: 2px; }
  .node.match circle { stroke: var(--focus); stroke-width: 2.5px; }
  .node:hover circle { stroke-width: 2.5px; }
  .node:focus { outline: none; }
  .node:focus-visible circle { stroke: var(--focus); stroke-width: 3px; }
  .node.mission-node circle { filter: drop-shadow(0 0 7px var(--mission-glow)); }

  /* ---------- side panel ---------- */
  .panel {
    width: 340px;
    flex-shrink: 0;
    border-left: 1px solid var(--border);
    background: var(--surface);
    overflow-y: auto;
    padding: 20px;
    padding-block: 20px max(20px, env(safe-area-inset-bottom));
  }
  .panel h2 {
    font-family: "IBM Plex Mono", monospace;
    font-size: 14px;
    font-weight: 500;
    margin: 0 0 4px;
    word-break: break-word;
    line-height: 1.4;
  }
  .kind-tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 10.5px;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-bottom: 14px;
  }
  .panel .desc {
    font-size: 13px;
    line-height: 1.6;
    color: var(--ink-2);
    margin-bottom: 18px;
  }
  .panel .desc code, .desc-mono { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink); }
  .panel section { margin-bottom: 20px; }
  .panel section h3 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--ink-3);
    margin: 0 0 8px;
    font-weight: 600;
  }
  .qa {
    border-left: 2px solid var(--border-strong);
    padding-left: 10px;
    margin-bottom: 12px;
  }
  .qa .q { font-size: 12.5px; font-style: italic; color: var(--ink); line-height: 1.5; }
  .qa .a-target {
    font-size: 11px;
    color: var(--ink-3);
    margin-top: 4px;
    font-family: "IBM Plex Mono", monospace;
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
  }
  .qa .a-target:hover { color: var(--focus); }
  .qa .note { font-size: 11.5px; color: var(--ink-3); margin-top: 4px; line-height: 1.5; }

  .breadcrumb { display: flex; flex-direction: column; gap: 2px; }
  .crumb {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11.5px;
    padding: 5px 7px;
    border-radius: 5px;
    cursor: pointer;
    color: var(--ink-2);
  }
  .crumb:hover { background: var(--surface-2); color: var(--ink); }
  .crumb .arrow { color: var(--ink-3); flex-shrink: 0; }
  .crumb .dot { flex-shrink: 0; }

  .empty-state h3 {
    font-family: "Fraunces", serif;
    font-weight: 500;
    font-size: 17px;
    margin: 0 0 8px;
    text-wrap: balance;
  }
  .empty-state p { font-size: 13px; line-height: 1.65; color: var(--ink-2); margin: 0 0 14px; }
  .empty-state .mini-legend { display: flex; flex-direction: column; gap: 9px; margin-top: 4px; }
  .empty-state .mini-legend .item { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); }

  .close-panel-btn { display: none; }

  /* ---------- responsive ---------- */
  @media (max-width: 760px) {
    .stats { display: none; }
    .legend { display: none; }
    .brand p { display: none; }
    .search-wrap { flex: 1 1 auto; margin-left: 0; }
    .topbar { gap: 10px; }
    .panel {
      position: absolute;
      inset: auto 0 0 0;
      width: auto;
      max-height: 62%;
      border-left: none;
      border-top: 1px solid var(--border);
      border-radius: 14px 14px 0 0;
      box-shadow: 0 -8px 24px rgba(0,0,0,0.18);
      transform: translateY(100%);
      transition: transform .25s ease;
      z-index: 5;
    }
    .panel.open { transform: translateY(0); }
    .close-panel-btn {
      display: block;
      position: absolute;
      top: 10px;
      right: 12px;
      background: none;
      border: none;
      color: var(--ink-3);
      font-size: 20px;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }
    .hint { display: none; }
  }
</style>

<div class="app">
  <div class="topbar">
    <div class="brand">
      <h1>How Chain Explorer</h1>
      <p>iacs / poc/how_chain/how.yaml</p>
    </div>
    <div class="stats" id="stats"></div>
    <div class="legend">
      <span class="item"><span class="dot" style="background:var(--mission)"></span>mission</span>
      <span class="item"><span class="dot" style="background:var(--concept)"></span>subsystem</span>
      <span class="item"><span class="dot" style="background:var(--code)"></span>real file</span>
      <span class="item"><span class="dot" style="background:var(--member)"></span>class / function</span>
      <span class="item">+ expand &middot; &minus; collapse</span>
    </div>
    <div class="search-wrap">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg>
      <input id="search" type="text" placeholder="find a node…" autocomplete="off" />
    </div>
    <button class="reset" id="resetBtn">Reset view</button>
  </div>

  <div class="main">
    <div class="stage">
      <svg id="graph"></svg>
      <div class="hint">Everything starts collapsed. Click a node marked <strong>+</strong> to reveal what's beneath it, click it again (now marked <strong>&minus;</strong>) to collapse it back. Drag to pan, scroll/pinch to zoom.</div>
    </div>
    <div class="panel" id="panel">
      <button class="close-panel-btn" id="closePanel" aria-label="Close">&times;</button>
      <div id="panelBody"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
(async function () {
  "use strict";

  const raw = await fetch("data.json").then(r => r.json());

  // ---------- build graph model ----------
  // raw.nodes: [{id, description, kind}]  kind: mission | subsystem | file | member
  // raw.edges: [{source, target, question, note}]  (source is how target gets achieved -- source asks, target answers)
  // The graph is a strict tree (nodes.length === edges.length + 1), which is
  // what makes a collapsible d3.hierarchy/d3.tree layout a clean fit: every
  // non-mission node has exactly one parent.

  const KIND_COLOR_VAR = { mission: "--mission", subsystem: "--concept", file: "--code", member: "--member" };
  const KIND_LABEL = { mission: "the mission", subsystem: "subsystem", file: "real file", member: "class or function" };
  function colorOf(d) { return `var(${KIND_COLOR_VAR[d.kind]})`; }
  function kindOf(d) { return KIND_LABEL[d.kind]; }

  const nodeById = new Map(raw.nodes.map(n => [n.id, { ...n, outEdges: [], inEdges: [] }]));
  raw.edges.forEach(e => {
    nodeById.get(e.source).outEdges.push(e);
    nodeById.get(e.target).inEdges.push(e);
  });

  const MISSION_ID = "emc2p_mission";
  const TOTAL_NODE_COUNT = raw.nodes.length;

  // depth = shortest number of hops from the mission, following "how" edges forward
  const depth = new Map();
  depth.set(MISSION_ID, 0);
  {
    let frontier = [MISSION_ID];
    while (frontier.length) {
      const next = [];
      for (const id of frontier) {
        const d = depth.get(id);
        for (const e of nodeById.get(id).outEdges) {
          if (!depth.has(e.target)) {
            depth.set(e.target, d + 1);
            next.push(e.target);
          }
        }
      }
      frontier = next;
    }
  }
  const TOTAL_MAX_DEPTH = Math.max(...depth.values());

  function edgeKey(s, t) { return `${s}\u0000${t}`; }

  function cleanText(t) {
    if (!t) return "";
    return t.split(/\n\s*\n/).map(p => p.replace(/\s*\n\s*/g, " ").trim()).join("\n\n");
  }

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function mdCodeToHtml(s) {
    return escapeHtml(s).replace(/`([^`]+)`/g, "<code>$1</code>");
  }

  function renderParas(text) {
    return cleanText(text).split(/\n\n/).map(p => `<p>${mdCodeToHtml(p)}</p>`).join("");
  }

  function shortLabel(id) {
    if (id === MISSION_ID) return "emc2p_mission";
    const parts = id.split(".");
    const base = parts.length > 1 ? parts.slice(-1)[0] : id;
    return base.length > 26 ? base.slice(0, 24) + "\u2026" : base;
  }

  // ---------- build the collapsible hierarchy ----------
  // The flat nodeById/outEdges graph above stays the single source of truth
  // for every node's data (description, kind, question/note on each edge);
  // this hierarchy is a parallel structure that exists only to drive the
  // tree layout and which nodes are currently visible.
  function buildTreeNode(id) {
    return { id, children: nodeById.get(id).outEdges.map(e => buildTreeNode(e.target)) };
  }
  const root = d3.hierarchy(buildTreeNode(MISSION_ID));

  // A permanent lookup from id to its hierarchy node, independent of
  // collapse state (collapsing only clears `.children`, never `.parent`),
  // so search and "go to" links can find and reveal any node on demand.
  const hierNodeById = new Map();
  root.each(d => hierNodeById.set(d.data.id, d));

  // Start with everything collapsed -- even the mission's own children --
  // since the full 357-node graph is unreadable shown all at once.
  //
  // Iterates hierNodeById's full, pre-captured node list rather than
  // walking root via `.each()`: that traversal reads a node's `.children`
  // only *after* invoking the visit callback, so nulling `.children`
  // inside the callback (as collapsing requires) makes it stop descending
  // right there -- every node beyond the first level would be silently
  // skipped and left un-collapsed, which is exactly backwards from the
  // intent. A flat array walk has no such self-interference.
  function collapseAll() {
    hierNodeById.forEach(d => {
      if (d.children) { d._children = d.children; d.children = null; }
    });
  }
  collapseAll();

  function radiusOf(d) {
    const kind = nodeById.get(d.data.id).kind;
    if (kind === "mission") return 13;
    const kids = d.children || d._children;
    if (!kids) return kind === "member" ? 3.5 : 4.5;
    return Math.min(11, 5 + Math.sqrt(kids.length) * 2.2);
  }

  // ---------- svg scaffolding ----------
  const colW = 110, rowH = 120;
  const treeLayout = d3.tree().nodeSize([colW, rowH]);
  const svg = d3.select("#graph");
  const stage = document.querySelector(".stage");

  function currentSize() {
    return { w: stage.clientWidth, h: stage.clientHeight };
  }

  const g = svg.append("g").attr("class", "viewport");
  const edgeLayer = g.append("g").attr("class", "edges");
  const nodeLayer = g.append("g").attr("class", "nodes-layer");

  const linkPath = d3.linkVertical().x(d => d.x).y(d => d.y);

  svg.append("defs").append("marker")
    .attr("id", "arrow")
    .attr("viewBox", "0 0 10 10")
    .attr("refX", 8).attr("refY", 5)
    .attr("markerWidth", 6).attr("markerHeight", 6)
    .attr("orient", "auto-start-reverse")
    .append("path")
    .attr("d", "M0,0 L10,5 L0,10 z")
    .attr("fill", "var(--edge)");

  let selectedId = null;

  function nodeClass(d) {
    return "node" + (d.data.id === MISSION_ID ? " mission-node" : "");
  }
  function ariaLabelOf(d) {
    const n = nodeById.get(d.data.id);
    const state = d.children ? ", expanded" : d._children ? ", collapsed, click to reveal what it explains" : "";
    return `${d.data.id}, ${kindOf(n)}${state}`;
  }

  // Each `how` component lives on the entity that asks (the registry
  // owner, the data model's e.source) and names, as its value, the entity
  // that is the answer (e.target) -- the mission asks "how", a subsystem
  // answers, and so on down to a real file. That's already the direction
  // a viewer wants to read top-down, so unlike ((why_chain)), the arrow is
  // drawn straight from source to target, no reversal needed.

  // ---------- render: d3's classic collapsible-tree enter/update/exit ----------
  function update(source) {
    treeLayout(root);
    const nodes = root.descendants();
    const links = root.links();

    const node = nodeLayer.selectAll("g.node").data(nodes, d => d.data.id);

    const nodeEnter = node.enter().append("g")
      .attr("class", nodeClass)
      .attr("transform", () => `translate(${source.x0 ?? source.x},${source.y0 ?? source.y})`)
      .style("cursor", "pointer")
      .attr("tabindex", 0)
      .attr("role", "button")
      .attr("aria-label", ariaLabelOf)
      .on("click", (event, d) => { event.stopPropagation(); activate(d); })
      .on("keydown", (event, d) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          event.stopPropagation();
          activate(d);
        }
      })
      .on("focus", (event, d) => showTip(event, nodeById.get(d.data.id)))
      .on("blur", hideTip)
      .on("mouseenter", (event, d) => showTip(event, nodeById.get(d.data.id)))
      .on("mouseleave", hideTip);

    nodeEnter.append("circle").attr("r", 1e-6);
    nodeEnter.append("text").attr("class", "toggle").attr("dy", "0.32em");
    nodeEnter.append("text").attr("class", "label").attr("text-anchor", "middle");

    const nodeUpdate = nodeEnter.merge(node);
    nodeUpdate
      .attr("class", nodeClass)
      .attr("aria-label", ariaLabelOf);
    nodeUpdate.select("circle")
      .attr("fill", d => colorOf(nodeById.get(d.data.id)));
    nodeUpdate.select("text.toggle")
      .text(d => (d._children ? "+" : d.children ? "\u2212" : ""));
    nodeUpdate.select("text.label")
      .attr("dy", d => radiusOf(d) + 11)
      .text(d => shortLabel(d.data.id));

    nodeUpdate.transition().duration(320)
      .attr("transform", d => `translate(${d.x},${d.y})`);
    nodeUpdate.select("circle").transition().duration(320)
      .attr("r", radiusOf);

    const nodeExit = node.exit();
    nodeExit.transition().duration(320)
      .attr("transform", () => `translate(${source.x},${source.y})`)
      .remove();
    nodeExit.select("circle").transition().duration(320).attr("r", 1e-6);

    const link = edgeLayer.selectAll("path.edge").data(links, d => d.target.data.id);

    const linkEnter = link.enter().insert("path", "g")
      .attr("class", "edge")
      .attr("marker-end", "url(#arrow)")
      .attr("d", () => {
        const o = { x: source.x0 ?? source.x, y: source.y0 ?? source.y };
        return linkPath({ source: o, target: o });
      });

    linkEnter.merge(link).transition().duration(320)
      .attr("d", d => linkPath({ source: d.source, target: d.target }));

    link.exit().transition().duration(320)
      .attr("d", () => {
        const o = { x: source.x, y: source.y };
        return linkPath({ source: o, target: o });
      })
      .remove();

    nodes.forEach(d => { d.x0 = d.x; d.y0 = d.y; });

    applyHighlight();
    updateLabelVisibility();
    document.getElementById("stats").innerHTML =
      `<span><b>${nodes.length}</b> / ${TOTAL_NODE_COUNT} nodes shown</span><span><b>${links.length}</b> edges shown</span><span><b>${TOTAL_MAX_DEPTH}</b> hops max</span>`;
    fitView(nodes);
  }

  function toggle(d) {
    if (d.children) { d._children = d.children; d.children = null; }
    else { d.children = d._children; d._children = null; }
    update(d);
  }

  function expandAncestors(hd) {
    let p = hd.parent;
    while (p) {
      if (p._children) { p.children = p._children; p._children = null; }
      p = p.parent;
    }
  }

  function activate(d) {
    if (d.children || d._children) toggle(d);
    selectNode(d.data.id);
  }

  // Reveal `id` by expanding every collapsed ancestor on its path from the
  // mission, then select it -- used by search and by the panel's own
  // "answered by" / "part of" / lineage links, any of which can point at a
  // node that isn't currently shown.
  function goto(id) {
    const hd = hierNodeById.get(id);
    expandAncestors(hd);
    update(hd);
    selectNode(id);
  }

  // ---------- zoom / pan ----------
  const zoom = d3.zoom()
    .scaleExtent([0.2, 3])
    .on("zoom", (event) => {
      g.attr("transform", event.transform);
      updateLabelVisibility(event.transform.k);
    })
    .on("start", () => svg.classed("grabbing", true))
    .on("end", () => svg.classed("grabbing", false));

  svg.call(zoom);
  svg.on("click", () => selectNode(null));

  // With collapse/expand keeping the visible set small, every visible
  // label can usually stay on -- but a selection still narrows to what's
  // relevant, the same way it always has.
  const LABEL_ZOOM = 0.6;
  let currentK = 1;
  function updateLabelVisibility(k) {
    if (k !== undefined) currentK = k;
    const focusIds = selectedId ? relevantIds(selectedId) : null;
    nodeLayer.selectAll("text.label").style("opacity", d => {
      if (focusIds) return focusIds.has(d.data.id) ? 1 : 0;
      return (currentK >= LABEL_ZOOM || radiusOf(d) >= 9) ? 1 : 0;
    });
  }
  function relevantIds(id) {
    const { nodesSet } = ancestorsOf(id);
    const d = nodeById.get(id);
    d.outEdges.forEach(e => nodesSet.add(e.target));
    return nodesSet;
  }

  function fitView(nodes) {
    const { w, h } = currentSize();
    const xExtent = d3.extent(nodes, d => d.x);
    const yExtent = d3.extent(nodes, d => d.y);
    const treeW = (xExtent[1] - xExtent[0]) || 1;
    const treeH = (yExtent[1] - yExtent[0]) || 1;
    const scale = nodes.length <= 1
      ? 1.1
      : Math.min(1.3, Math.max(0.35, Math.min((w - 60) / treeW, (h - 140) / (treeH + 120))));
    const cx = (xExtent[0] + xExtent[1]) / 2;
    const tx = w / 2 - cx * scale;
    const ty = 60 - yExtent[0] * scale;
    svg.transition().duration(320).call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
  }

  function resize() {
    const { w, h } = currentSize();
    svg.attr("viewBox", `0 0 ${w} ${h}`);
  }
  window.addEventListener("resize", () => { resize(); });
  resize();

  // ---------- selection & highlighting ----------

  function ancestorsOf(id) {
    // all nodes/edges reachable by walking inEdges back toward the mission
    const nodesSet = new Set([id]);
    const edgeKeySet = new Set();
    const stack = [id];
    while (stack.length) {
      const cur = stack.pop();
      for (const e of nodeById.get(cur).inEdges) {
        edgeKeySet.add(edgeKey(e.source, e.target));
        if (!nodesSet.has(e.source)) { nodesSet.add(e.source); stack.push(e.source); }
      }
    }
    return { nodesSet, edgeKeySet };
  }

  // Re-applies the current selection's highlight classes to whatever nodes
  // and edges are presently in the DOM -- called after every render, since
  // expand/collapse constantly adds and removes elements.
  function applyHighlight() {
    const nodeSel = nodeLayer.selectAll("g.node");
    const edgeSel = edgeLayer.selectAll("path.edge");
    if (!selectedId) {
      nodeSel.attr("class", nodeClass);
      edgeSel.attr("class", "edge");
      return;
    }
    const d = nodeById.get(selectedId);
    const { nodesSet, edgeKeySet } = ancestorsOf(selectedId);
    const childIds = new Set(d.outEdges.map(e => e.target));

    nodeSel.attr("class", n => {
      let c = nodeClass(n);
      if (n.data.id === selectedId) c += " selected";
      else if (nodesSet.has(n.data.id)) c += " ancestor";
      else if (childIds.has(n.data.id)) c += " child";
      else c += " dim";
      return c;
    });

    edgeSel.attr("class", e => {
      const key = edgeKey(e.source.data.id, e.target.data.id);
      if (edgeKeySet.has(key)) return "edge lit";
      if (e.source.data.id === selectedId) return "edge child-lit";
      return "edge dim";
    });
  }

  function selectNode(id) {
    selectedId = id;
    if (!id) {
      applyHighlight();
      renderEmptyPanel();
      closeMobilePanel();
      updateLabelVisibility();
      return;
    }
    const d = nodeById.get(id);
    applyHighlight();
    renderPanel(d);
    openMobilePanel();
    updateLabelVisibility();
  }

  // ---------- tooltip ----------
  const tip = d3.select("body").append("div")
    .style("position", "fixed")
    .style("pointer-events", "none")
    .style("z-index", 20)
    .style("max-width", "260px")
    .style("padding", "8px 10px")
    .style("border-radius", "8px")
    .style("font-size", "12px")
    .style("line-height", "1.5")
    .style("background", "var(--surface)")
    .style("border", "1px solid var(--border-strong)")
    .style("color", "var(--ink-2)")
    .style("box-shadow", "0 6px 20px rgba(0,0,0,0.18)")
    .style("opacity", 0)
    .style("font-family", "IBM Plex Sans, sans-serif");

  function showTip(event, d) {
    tip.html(`<div style="font-family:'IBM Plex Mono',monospace;color:var(--ink);margin-bottom:3px;">${escapeHtml(d.id)}</div><div style="opacity:.7;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;">${kindOf(d)}</div>${escapeHtml(cleanText(d.description).slice(0, 180))}${d.description.length > 180 ? "\u2026" : ""}`)
      .style("left", (event.clientX + 14) + "px")
      .style("top", (event.clientY + 10) + "px")
      .style("opacity", 1);
  }
  function hideTip() { tip.style("opacity", 0); }

  // ---------- side panel ----------
  const panelBody = document.getElementById("panelBody");
  const panelEl = document.getElementById("panel");

  function openMobilePanel() { panelEl.classList.add("open"); }
  function closeMobilePanel() { panelEl.classList.remove("open"); }
  document.getElementById("closePanel").addEventListener("click", () => selectNode(null));

  function renderEmptyPanel() {
    panelBody.innerHTML = `
      <div class="empty-state">
        <h3>One mission, every file and function</h3>
        <p>This is emc2p's "how" chain, run the opposite way from
        <span class="desc-mono">why_chain</span>: starting from
        <span class="desc-mono">emc2p_mission</span>, each node asks "how does
        this actually happen", answered by one or more more-concrete nodes,
        down through subsystems and files to the real classes and functions
        that do the work.</p>
        <div class="mini-legend">
          <div class="item"><span class="dot" style="background:var(--mission);width:12px;height:12px"></span> the mission &mdash; the graph's one root</div>
          <div class="item"><span class="dot" style="background:var(--concept);width:12px;height:12px"></span> a subsystem, grouping files that answer the same "how"</div>
          <div class="item"><span class="dot" style="background:var(--code);width:12px;height:12px"></span> a real file in the package</div>
          <div class="item"><span class="dot" style="background:var(--member);width:12px;height:12px"></span> a real class or function in that file</div>
        </div>
        <p style="margin-top:14px;">Everything starts collapsed, showing just the mission. Click a node marked <strong>+</strong> to reveal what it explains; click it again to collapse it back. Each node's own panel shows the question <em>it</em> raises and who answers it, under &ldquo;how this happens&rdquo; &mdash; and what it's part of, under &ldquo;part of.&rdquo;</p>
      </div>`;
  }

  function renderPanel(d) {
    const kindLabel = d.kind === "mission" ? "the mission &middot; graph root" : kindOf(d);

    let html = `<h2>${escapeHtml(d.id)}</h2><div class="kind-tag"><span class="dot" style="background:${colorOf(d)}"></span>${kindLabel}</div>`;
    html += `<div class="desc">${renderParas(d.description) || "<em>(no description)</em>"}</div>`;

    // The `how` question/note lives with the entity that ASKS it -- that's
    // d.outEdges (this entity holds the `how` component, naming the more
    // concrete entities that answer it). What explains d itself (d.inEdges,
    // normally just its one parent) gets only a bare "part of" entry here.
    if (d.outEdges.length) {
      html += `<section><h3>${d.outEdges.length === 1 ? "How this happens" : `${d.outEdges.length} ways this happens`}</h3>`;
      d.outEdges.forEach(e => {
        html += `<div class="qa"><div class="q">${mdCodeToHtml(e.question)}</div>
          <div class="a-target" data-goto="${escapeHtml(e.target)}">&rarr; answered by ${escapeHtml(shortLabel(e.target))}</div>
          ${e.note ? `<div class="note">${mdCodeToHtml(cleanText(e.note))}</div>` : ""}</div>`;
      });
      html += `</section>`;
    }

    if (d.inEdges.length) {
      html += `<section><h3>Part of</h3>`;
      d.inEdges.forEach(e => {
        html += `<div class="crumb" data-goto="${escapeHtml(e.source)}"><span class="dot" style="width:7px;height:7px;background:${colorOf(nodeById.get(e.source))}"></span>${escapeHtml(shortLabel(e.source))}<span class="arrow">&rarr;</span></div>`;
      });
      html += `</section>`;
    }

    if (d.id !== MISSION_ID) {
      const path = shortestPathToMission(d.id);
      html += `<section><h3>Lineage from the mission</h3><div class="breadcrumb">`;
      path.forEach(id => {
        const n = nodeById.get(id);
        html += `<div class="crumb" data-goto="${escapeHtml(id)}"><span class="dot" style="width:7px;height:7px;background:${colorOf(n)}"></span>${escapeHtml(shortLabel(id))}</div>`;
      });
      html += `</div></section>`;
    }

    panelBody.innerHTML = html;
    panelBody.querySelectorAll("[data-goto]").forEach(el => {
      el.addEventListener("click", (ev) => { ev.stopPropagation(); goto(el.getAttribute("data-goto")); });
    });
  }

  function shortestPathToMission(id) {
    // BFS backward from id to mission using precomputed depth as a guide
    const path = [id];
    let cur = id;
    while (cur !== MISSION_ID) {
      const inE = nodeById.get(cur).inEdges;
      if (!inE.length) break;
      let best = inE[0];
      for (const e of inE) if (depth.get(e.source) < depth.get(best.source)) best = e;
      cur = best.source;
      path.unshift(cur);
    }
    return path;
  }

  renderEmptyPanel();

  // ---------- search ----------
  // Search can match any of the 357 nodes, not just the handful currently
  // expanded into view -- jumping to a match expands its whole ancestor
  // chain via goto(), the same path the panel's own links use.
  const allIds = Array.from(nodeById.keys());
  const searchInput = document.getElementById("search");
  searchInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      const q = searchInput.value.trim().toLowerCase();
      if (!q) return;
      const hit = allIds.find(id => id.toLowerCase().includes(q));
      if (hit) goto(hit);
    }
  });

  document.getElementById("resetBtn").addEventListener("click", () => {
    searchInput.value = "";
    selectNode(null);
    collapseAll();
    update(root);
  });

  // ---------- first render ----------
  update(root);
})();
</script>
