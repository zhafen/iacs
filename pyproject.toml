[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iacs"
version = "0.1.5"
description = "Infrastructure as Code Sketch"
requires-python = ">=3.10"
dependencies = [
    "emc2p[testing]",
    "duckdb>=1.3.2",
    "fastapi[standard]>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "graphviz>=0.21",
    "ibis-framework[duckdb]>=2.0.0",
    "jupyterlab>=4.5.5",
    "matplotlib>=3.10.8",
    "networkx>=3.4.2",
    "pandas>=2.0.0",
    "pandera[ibis]>=0.25.0",
    "pydantic>=2.10.6",
    "pytest>=9.0.2",
    "pyyaml>=6.0",
    "sf-hamilton[sdk,ui]>=1.88.0",
    "mcp>=1.27.0,<2.0.0",
    "seaborn>=0.13.2",
    "tabulate>=0.10.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.27.0,<2.0.0",
    "tabulate>=0.10.0",
]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
iacs-mcp = "iacs.mcp_server:main"
iacs = "iacs.cli:main"

[tool.uv.sources]
# emc2p used to be vendored as a git submodule at ./emc2p purely so a
# single-repo-attached session could reach its source for editable local
# dev -- no longer needed now that multiple repos can be attached
# directly. Pinned by commit (not branch) so this is a real, reproducible
# version pin, bumped explicitly the same way the submodule pointer used
# to be.
emc2p = { git = "https://github.com/zhafen/emc2p", rev = "93dbf0108e9233c9be5f4b009eac4d5d699d739a" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that reload a full manifest/registrar, exercise end-to-end example manifests, or measure import/startup time -- individually fast but numerous enough to dominate the full suite's wall time. Skip with `-m \"not slow\"` for a quick check.",
]

[tool.setuptools]
py-modules = ["app"]

[tool.setuptools.packages.find]
where = ["."]
include = ["iacs*"]

[tool.setuptools.package-data]
iacs = ["builtins/*.yaml", "iacs_manifest/*.yaml", "static/*.js"]

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-literate-nav>=0.6.3",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.3",
]
